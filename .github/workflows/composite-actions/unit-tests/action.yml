name: "Unit Tests"
description: "Run unit tests for lok8s"

inputs:
  codecov-token:
    description: "Codecov upload token (secrets aren't available directly inside composite actions, so callers must pass secrets.CODECOV_TOKEN through explicitly)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvirt-dev

    - name: Run unit tests
      shell: bash
      run: |
        go test -v -race -coverprofile=coverage.out ./pkg/...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ inputs.codecov-token }}
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
